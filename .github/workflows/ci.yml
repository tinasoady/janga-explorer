# Vérifications à chaque push et pull request, puis migrations Supabase sur main.
#
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions (voir README) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel : supabase.com > Account > Access Tokens
#   SUPABASE_DB_PASSWORD   mot de passe de la base (Project Settings > Database)
#   SUPABASE_PROJECT_ID    identifiant du projet (la partie avant .supabase.co)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Sur une PR, un nouveau push remplace la vérification en cours ; sur main, on va toujours au bout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Les types des routes (PageProps…) sont générés par Next.js avant la vérification TypeScript.
      - run: npx next typegen
      - run: npx tsc --noEmit
      # Sans variables Supabase, le build se fait en mode démonstration : il vérifie la compilation, pas les données.
      - run: npm run build

  db-test:
    name: Tests SQL des migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:test

  migrate:
    name: Migrations Supabase (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Seuls les tests SQL sont attendus : la migration doit partir vite, Vercel déploie le code en parallèle.
    needs: db-test
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Vérifier les secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing (voir README, section Intégration continue)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Migrations en attente
        run: npx supabase migration list
      - run: npx supabase db push --yes
